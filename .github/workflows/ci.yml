name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Protocol and settings tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test without audio hardware
        run: dotnet test tests/WinPlay.Core.Tests/WinPlay.Core.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Exercise offline probe command
        run: dotnet run --project src/Win2HomePod.Probe/Win2HomePod.Probe.csproj -c Release --no-build -- plan --codec 1 --audio-format 0x800 --spf 176 --timing ntp --output .state/probe-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: offline-probe-${{ matrix.os }}
          path: .state/probe-plan.json
          include-hidden-files: true
          if-no-files-found: error

  windows-build:
    name: Windows build and UI smoke test
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows app
        shell: pwsh
        run: ./build.ps1
      - name: Publish experimental probe CLI
        shell: pwsh
        run: ./build-probe.ps1
      - name: Exercise published probe without a receiver
        shell: pwsh
        run: |
          & ./probe-app/Win2HomePod.Probe.exe plan --output .state/published-probe-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'Published probe plan failed' }
      - name: Render UI without discovery or streaming
        shell: pwsh
        run: |
          $process = Start-Process ./app/Win2HomePod.exe -ArgumentList '--render' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'UI render timed out'
          }
          if ($process.ExitCode -ne 0) { throw "UI render failed: $($process.ExitCode)" }
          if (-not (Test-Path .state/ui.png)) { throw 'UI screenshot was not generated' }
      - name: Stage launch scripts and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item app dist/app -Recurse
          Copy-Item probe-app dist/probe-app -Recurse
          Copy-Item docs dist/docs -Recurse
          Copy-Item Start.cmd, Stop.cmd, README.md, VERIFICATION.md, LICENSE dist
      - uses: actions/upload-artifact@v4
        with:
          name: Win2HomePod-win-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-smoke
          path: |
            .state/ui.png
            .state/*.log
          include-hidden-files: true
          if-no-files-found: warn
